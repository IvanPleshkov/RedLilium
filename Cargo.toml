[workspace]
resolver = "2"
members = [
    "core",
    "ecs",
    "ecs-macro",
    "graphics",
    "app",
    "runtime",
    "demos",
    "editor",
    "debug_drawer",
    "gizmo",
    "vfs",
    "assets",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/IvanPleshkov/RedLilium"

[workspace.dependencies]
# Window and input handling
winit = "0.30.12"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
bitflags = "2.10"
fixedbitset = "0.5"
smallvec = "1.13"
static_assertions = "1.1"

# Web support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_log = "1.0"
console_error_panic_hook = "0.1"
# Drop-in `std::time::Instant` that works on wasm (perf.now) and re-exports std
# on native — std `Instant::now()` panics on wasm32-unknown-unknown (#33).
web-time = "1.1"

# Testing
rstest = "0.26.1"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# GPU backends
wgpu = "28.0.0"
ash = "0.38.0"
gpu-allocator = "0.28"
parking_lot = "0.12"
pollster = "0.4"
naga = { version = "24.0", features = ["wgsl-in", "wgsl-out", "spv-out"] }
shader-slang = "0.1"

# Math and data
bytemuck = { version = "1.21", features = ["derive"] }

# UI
egui = "0.33.3"
egui_dock = "0.18.0"

# glTF loading
gltf-dep = { package = "gltf", version = "1.4.1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Physics
nalgebra = { version = "0.33", features = ["convert-bytemuck", "serde-serialize"] }
rapier3d = "0.32"
rapier3d-f64 = { package = "rapier3d-f64", version = "0.32" }
rapier2d = "0.32"
rapier2d-f64 = { package = "rapier2d-f64", version = "0.32" }

# Async IO runtime
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
toml = "0.8"
ron = "0.8"
bincode = "1"

# SSH/SFTP (for VFS sftp feature)
async-trait = "0.1"
russh = "0.48"
russh-keys = "0.48"
russh-sftp = "2.1"

# File watching
notify = "8"

# Dynamic library loading (game cdylib warm-restart reload, ADR-020)
libloading = "0.8"

# Profiling (optional)
tracy-client = "0.18"
