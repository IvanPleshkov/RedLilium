[package]
name = "redlilium-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Application framework for RedLilium Engine"

[features]
default = []
profiling = ["redlilium-core/profiling", "redlilium-graphics/profiling"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redlilium-core = { path = "../core" }
# Portable graphics (no Vulkan/Slang) so this builds on wasm32; native
# re-enables the full backend set in the not-wasm32 table below.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }

# Window and input handling
winit = { workspace = true }

# Logging
log = { workspace = true }

# Utilities
parking_lot = { workspace = true }
# Portable clock: std `Instant::now()` panics on wasm; `web-time` uses perf.now
# there and re-exports std on native (#33).
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }
pollster = { workspace = true }
clap = { workspace = true }
# Full graphics backend on native (adds Vulkan + runtime Slang compilation).
redlilium-graphics = { path = "../graphics" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# Fetch the target canvas from the DOM to attach the winit window to it (#33).
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }
console_log = { workspace = true }
console_error_panic_hook = { workspace = true }
