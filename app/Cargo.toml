[package]
name = "redlilium-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Application framework for RedLilium Engine"

[features]
default = []
profiling = ["redlilium-core/profiling", "redlilium-graphics/profiling"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redlilium-core = { path = "../core" }
# Portable graphics (no Vulkan/Slang) so this builds on wasm32; native
# re-enables the full backend set in the not-wasm32 table below.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }

# Window and input handling
winit = { workspace = true }

# Logging
log = { workspace = true }

# Utilities
parking_lot = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }
pollster = { workspace = true }
clap = { workspace = true }
# Full graphics backend on native (adds Vulkan + runtime Slang compilation).
redlilium-graphics = { path = "../graphics" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
console_log = { workspace = true }
console_error_panic_hook = { workspace = true }
