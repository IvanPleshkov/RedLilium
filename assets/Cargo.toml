[package]
name = "redlilium-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Asset system for RedLilium Engine (identity + request/handle loading; read->decode->gpu pipeline)"

[dependencies]
redlilium-core = { path = "../core" }
redlilium-vfs = { path = "../vfs" }
# Portable graphics on wasm; native re-enables Vulkan/Slang below.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }
serde = { workspace = true }
ron = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redlilium-graphics = { path = "../graphics" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# uuid v4/v5 need a browser randomness source on wasm (getrandom `js` backend).
uuid = { version = "1", features = ["js"] }
