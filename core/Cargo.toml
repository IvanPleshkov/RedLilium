[package]
name = "redlilium-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core crate for RedLilium Engine"

[features]
default = []
profiling = ["dep:tracy-client"]
physics-math = []
physics-f32 = []

[dependencies]
log.workspace = true
bytemuck = { workspace = true }
nalgebra = { workspace = true }
# Serialization of core asset data (vertex layouts, meshes, …). The workspace
# serde enables `derive` + `rc` (Arc<VertexLayout> rides through serde's rc).
serde = { workspace = true }

# glTF loading (mandatory part of core)
gltf-dep = { workspace = true }
image = { workspace = true }

# KTX2 container parsing (#120)
ktx2 = { workspace = true }
ruzstd = { workspace = true }

# Profiling (optional)
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false
