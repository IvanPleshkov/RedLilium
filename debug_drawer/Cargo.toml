[package]
name = "redlilium-debug-drawer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Debug drawing utilities for RedLilium Engine"

[dependencies]
# Portable graphics on wasm; native re-enables Vulkan/Slang below.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }
bytemuck = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redlilium-graphics = { path = "../graphics" }
