[package]
name = "redlilium-demos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Demo scenes showcasing RedLilium Engine capabilities"

[features]
default = []
profiling = ["redlilium-core/profiling", "redlilium-graphics/profiling", "redlilium-app/profiling"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redlilium-core = { path = "../core" }
# Portable graphics on wasm; native re-enables Vulkan/Slang below.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }
redlilium-app = { path = "../app" }
redlilium-ecs = { path = "../ecs", features = ["physics", "rendering"] }
redlilium-runtime = { path = "../runtime" }
redlilium-assets = { path = "../assets" }
winit.workspace = true
parking_lot = { workspace = true }
log.workspace = true
bytemuck = { workspace = true }
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
redlilium-graphics = { path = "../graphics" }
# PNG decode for the textured-quad and compressed-texture demos.
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "2.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element"] }

[[bin]]
name = "window_demo"
path = "src/bin/window_demo.rs"

# Async compute overlap harness for GPU profiling (#47 phase 4 / #82): needs
# a window and ideally a dedicated compute queue, so it is run by hand.
[[bin]]
name = "async_overlap_demo"
path = "src/bin/async_overlap_demo.rs"

[[bin]]
name = "pbr_ibl_demo"
path = "src/bin/pbr_ibl/main.rs"

[[bin]]
name = "textured_quad_demo"
path = "src/bin/textured_quad_demo.rs"

# Hardware inline ray tracing (#110): fullscreen ray-query rendering with
# GPU-built BLAS/TLAS. Needs a GPU with VK_KHR_ray_query, so it is run by hand.
[[bin]]
name = "ray_query_demo"
path = "src/bin/ray_query_demo.rs"

# Meshlet rendering (#111): task+mesh pipeline with per-meshlet culling.
# Needs a GPU with VK_EXT_mesh_shader, so it is run by hand.
[[bin]]
name = "meshlet_demo"
path = "src/bin/meshlet_demo.rs"

# Bindless texture heap (#117): one draw over a quad grid, textures picked
# per instance by index. Needs descriptor indexing, so it is run by hand.
[[bin]]
name = "bindless_demo"
path = "src/bin/bindless_demo.rs"

[[bin]]
name = "physics_demo"
path = "src/bin/physics_demo/main.rs"

[[bin]]
name = "plugin_demo"
path = "src/bin/plugin_demo.rs"

# Manual end-to-end harness for warm-restart reload (#45): loads the demos
# cdylib as a game module and reloads it. Needs a GPU adapter, so it is run by
# hand, not in CI.
[[bin]]
name = "reload_harness"
path = "src/bin/reload_harness.rs"

[[example]]
name = "window_test"
path = "examples/window_test.rs"
