[package]
name = "redlilium-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Editor application for RedLilium Engine"

[features]
default = []
# Compile Slang at runtime for shader authoring / hot-reload. OFF by default so
# a plain `cargo run -p redlilium-editor` needs no Slang SDK and renders from the
# baked shader table; turn it on to edit `.slang` live:
#   cargo run -p redlilium-editor --features slang-shaders
# Needs the SDK (scripts/fetch-slang.sh).
slang-shaders = ["redlilium-graphics/slang-shaders"]

[dependencies]
redlilium-core = { path = "../core" }
redlilium-ecs = { path = "../ecs", features = ["rendering", "serialize-ron"] }
redlilium-assets = { path = "../assets" }
redlilium-graphics = { path = "../graphics" }
redlilium-app = { path = "../app" }
redlilium-runtime = { path = "../runtime" }
redlilium-debug-drawer = { path = "../debug_drawer" }
redlilium-gizmo = { path = "../gizmo" }
redlilium-vfs = { path = "../vfs", features = ["sftp"] }

parking_lot = { workspace = true }
# Used by the `gen_std_assets` bin (regenerates the std asset pack).
bincode = { workspace = true }
ron = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
bytemuck = { workspace = true }
egui = { workspace = true }
egui_dock = { workspace = true }
winit = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"
