[package]
name = "car-game"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Arcade car vertical slice built on redlilium-runtime (milestone: Vertical Slice — Arcade Car)"
default-run = "car-game"

[lib]
name = "car_game"
# cdylib: loadable game module for the editor's GameHost (#45).
# rlib: linked by this package's own bin for the standalone build.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "car-game"
path = "src/main.rs"

[dependencies]
redlilium-core = { path = "../core" }
# Portable graphics on wasm; native re-enables Vulkan/Slang below.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }
redlilium-ecs = { path = "../ecs", features = ["physics", "rendering", "serialize-ron"] }
redlilium-runtime = { path = "../runtime" }
redlilium-assets = { path = "../assets" }
redlilium-vfs = { path = "../vfs" }
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
redlilium-graphics = { path = "../graphics" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

# Windows icon + version resource (#133). Target-specific build-dependencies
# resolve against the HOST platform, matching build.rs's `#[cfg(windows)]`.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `xtask dist --target web` ships wasm-pack's release output; optimize the
# wasm for size (-Oz) instead of wasm-opt's default -O (#132). Cargo profiles
# can't be target-specific and wasm-pack is pinned to `release`, so the size
# work happens here rather than in `[profile.dist]`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
