[package]
name = "redlilium-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Game runtime for RedLilium Engine: the Plugin API and the host loop gluing app, ECS, graphics, and assets (ADR-020)"

[dependencies]
redlilium-core = { path = "../core" }
redlilium-app = { path = "../app" }
# Portable graphics on wasm; native re-enables Vulkan/Slang below.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }
redlilium-ecs = { path = "../ecs", features = ["rendering"] }
redlilium-assets = { path = "../assets" }
redlilium-vfs = { path = "../vfs" }

winit = { workspace = true }
log = { workspace = true }
bytemuck = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redlilium-graphics = { path = "../graphics" }
# Native dynamic game-module loading (dlopen); unavailable on wasm.
libloading = { workspace = true }
