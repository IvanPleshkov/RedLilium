[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build tooling for RedLilium (offline shader bake #33, dist packaging #107)"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
default = []
# Pulls in the native Slang compiler for `bake-shaders`. OFF by default so
# `cargo build --workspace` (preflight, fresh clones) needs no Slang SDK; the
# whole `bake` module is gated on it. Enable with `--features slang`.
slang = ["redlilium-graphics/slang-shaders"]

[dependencies]
# Native-only tooling. `shader::baked` (key functions, table types) is always
# available; the Slang compiler itself is pulled in only by the `slang` feature.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }
# Asset-DB loading + dependency walk for dist pack pruning (#134).
redlilium-assets = { path = "../assets" }
serde = { workspace = true }
ron = { workspace = true }
