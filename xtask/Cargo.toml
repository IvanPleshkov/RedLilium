[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build tooling for RedLilium (offline shader bake #33, dist packaging #107)"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
default = []
# Pulls in the native Slang compiler for `bake-shaders`. OFF by default so
# `cargo build --workspace` (preflight, fresh clones) needs no Slang SDK; the
# whole `bake` module is gated on it. Enable with `--features slang`.
slang = ["redlilium-graphics/slang-shaders"]

[dependencies]
# Native-only tooling. `shader::baked` (key functions, table types) is always
# available; the Slang compiler itself is pulled in only by the `slang` feature.
redlilium-graphics = { path = "../graphics", default-features = false, features = [
    "dummy",
    "wgpu-backend",
] }
# IBL bake (#137): CPU generation of the BRDF LUT + environment cubemaps into
# Zstd-supercompressed KTX2 (parsed back by redlilium-core for validation).
redlilium-core = { path = "../core" }
rayon = "1.10"
# Real libzstd bindings: better ratios than ruzstd's young encoder, and the
# bake is native-only tooling — wasm-cleanliness is a loader concern, not ours.
zstd = "0.13"
half = "2.4"
# The workspace `image` is png/jpeg-only; the bake additionally decodes the
# Radiance .hdr source.
image = { workspace = true, features = ["hdr"] }
